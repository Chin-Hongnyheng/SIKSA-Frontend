name: frontend
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  dio: ^5.9.2
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0
  geolocator: ^14.0.2
  shared_preferences: ^2.5.4
  firebase_messaging: ^16.1.2
  file_picker: ^10.3.10
  open_file: ^3.5.11
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  image_picker: ^1.2.1
  permission_handler: ^12.0.1
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  smooth_page_indicator: ^1.1.0
  go_router: ^14.0.0
  graphql_flutter: ^5.3.0
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/images/logov3.png
    - assets/animations/Online.json
    - assets/animations/Phone.json
    - assets/animations/Welcome.json
